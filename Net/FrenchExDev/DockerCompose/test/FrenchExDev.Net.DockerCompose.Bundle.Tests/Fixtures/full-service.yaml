name: my-app

services:
  web:
    image: nginx:latest
    container_name: my-web
    hostname: webhost
    restart: unless-stopped
    ports:
      - "8080:80"
      - target: 443
        published: "8443"
        protocol: tcp
    environment:
      NODE_ENV: production
      DEBUG: "false"
    volumes:
      - ./html:/usr/share/nginx/html:ro
      - type: volume
        source: data
        target: /data
    depends_on:
      db:
        condition: service_healthy
    networks:
      - frontend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      com.example.app: web
    deploy:
      replicas: 3
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    cap_add:
      - NET_ADMIN
    cap_drop:
      - ALL
    dns:
      - 8.8.8.8
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: "1.0"

  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: secret
    volumes:
      - pgdata:/var/lib/postgresql/data

networks:
  frontend:
    driver: bridge

volumes:
  data:
  pgdata:
    driver: local

secrets:
  db_password:
    file: ./secrets/db_password.txt

configs:
  app_config:
    file: ./config/app.yaml
