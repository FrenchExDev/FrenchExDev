solution: FrenchExDev.Net.BinaryWrapper.slnx

coverage:
  - "**/coverage.cobertura.xml"

mutations:
  - "**/mutation-report.json"

output: .quality-gate/

gates:
  max-cyclomatic-complexity: 60
  max-cognitive-complexity: 100
  max-class-coupling: 200
  max-inheritance-depth: 5
  min-maintainability-index: 20
  max-lcom: 50
  max-distance-from-main-sequence: 1.0
  max-duplication-percent: 5
  min-test-quality-score: 1.0

exclude:
  - "**/obj/**"
  - "**/bin/**"
  - "**/IsExternalInit.cs"
  - "**/Polyfills.cs"
  - "**/Result/**"
  - "**/Builder/**"
